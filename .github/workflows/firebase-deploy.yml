
name: Pixel Art CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Integracao Continua
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html
          test -f firebase.json
          test -d assets

      - name: Verificar sintaxe JavaScript
        run: node --check assets/js/canva.js

  deploy:
    name: Deploy no Firebase
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy no Firebase Hosting
        run: firebase deploy --only hosting --project pixel-art-creator-2026
